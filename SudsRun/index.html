<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Suds Run</title>
<meta name="description" content="You put soap in the fountain. Now run. An endless runner down Greek Row about why fountain pranks aren't that funny.">
<style>
  :root { --red:#d00000; --red-dark:#6d0000; --cream:#fdf2d0; --ink:#101820; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--ink); color:var(--cream); font-family:"Trebuchet MS", Verdana, sans-serif; }
  body { display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #wrap { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9; }
  canvas { width:100%; height:100%; display:block; touch-action:none; user-select:none; -webkit-user-select:none; background:#8fd0e8; }
  button { font:inherit; font-weight:800; letter-spacing:.04em; cursor:pointer; border:3px solid var(--cream); background:var(--red); color:var(--cream);
           padding:.5em 1.1em; border-radius:10px; box-shadow:0 4px 0 var(--red-dark); text-transform:uppercase; font-size:clamp(11px,1.7vw,18px);
           touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--red-dark); }
  button.ghost { background:transparent; box-shadow:none; }
  button.small { padding:.3em .7em; font-size:clamp(10px,1.3vw,14px); }
  button:focus-visible { outline:3px solid #ffd23f; outline-offset:2px; }
  #topbtns { position:absolute; top:1.5%; right:1.2%; display:flex; gap:6px; }
  #fctl { position:absolute; bottom:3%; left:0; right:0; display:flex; justify-content:center; gap:2%; pointer-events:none; }
  #fctl button { pointer-events:auto; }
  #btnPour { background:#2a8fc9; box-shadow:0 4px 0 #134e70; min-width:22%; }
  .hidden { display:none !important; }
  #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(10,14,22,.8); text-align:center; padding:2%; overflow:auto; }
  #panel { max-width:92%; max-height:100%; }
  h1 { margin:0; font-size:clamp(30px,7vw,78px); line-height:1; color:var(--cream); text-shadow:0 4px 0 var(--red), 0 8px 0 var(--red-dark); letter-spacing:.04em; }
  h2 { margin:.1em 0 .2em; font-size:clamp(22px,4.4vw,48px); text-shadow:0 3px 0 var(--red); }
  h3 { margin:.6em 0 .2em; font-size:clamp(12px,1.8vw,19px); color:#ffd23f; text-transform:uppercase; letter-spacing:.08em; }
  p { margin:.45em auto; font-size:clamp(11px,1.65vw,17px); max-width:60em; line-height:1.4; }
  .tag { font-size:clamp(12px,2vw,21px); font-weight:700; }
  .keys { display:inline-grid; grid-template-columns:auto auto; gap:.25em 1em; text-align:left; font-size:clamp(10px,1.45vw,15px); background:rgba(255,255,255,.07);
          border:2px solid rgba(253,242,208,.35); border-radius:10px; padding:.6em 1em; margin:.6em 0; }
  .keys b { color:#ffd23f; }
  .row { display:flex; gap:1.2em; justify-content:center; flex-wrap:wrap; margin-top:.8em; }
  .colors { display:flex; gap:.5em; justify-content:center; flex-wrap:wrap; margin:.3em 0; }
  .sw { display:flex; flex-direction:column; align-items:center; gap:.15em; background:rgba(255,255,255,.06); border:2px solid rgba(253,242,208,.3); box-shadow:none;
        padding:.35em .5em; border-radius:10px; text-transform:none; letter-spacing:0; font-size:clamp(9px,1.2vw,13px); min-width:6.2em; }
  .sw i { width:1.8em; height:1.8em; border-radius:50%; display:block; border:2px solid #fff; box-shadow:inset -3px -3px 0 rgba(0,0,0,.15); }
  .sw.on { border-color:#ffd23f; background:rgba(255,210,63,.18); }
  .sw:disabled { opacity:.45; cursor:not-allowed; }
  .sw small { font-weight:700; opacity:.85; min-height:1.1em; }
  .stats { display:flex; gap:.6em; justify-content:center; flex-wrap:wrap; margin:.4em 0; }
  .stat { background:rgba(255,255,255,.08); border-radius:10px; padding:.35em .9em; font-size:clamp(10px,1.4vw,15px); }
  .stat b { display:block; font-size:1.7em; color:#fff; }
  .cols2 { display:flex; gap:1.5em; justify-content:center; flex-wrap:wrap; text-align:left; }
  .cols2 > div { flex:1 1 16em; max-width:26em; }
  ul.check { list-style:none; padding:0; margin:.2em 0; font-size:clamp(10px,1.4vw,15px); }
  ul.check li { padding:.12em 0 .12em 1.5em; position:relative; }
  ul.check li::before { content:"✔"; position:absolute; left:0; color:#7dd3fc; }
  .fact { background:rgba(208,0,0,.22); border-left:4px solid var(--red); padding:.5em .8em; border-radius:6px; font-size:clamp(10px,1.45vw,15px); }
  .new { color:#7dff9a; font-weight:800; }
  .fine { font-size:clamp(9px,1.1vw,12px); opacity:.7; }
  .news { max-width:38em; margin:.7em auto .2em; text-align:left; background:#fdf8ec; color:#1b1b1b; border-radius:8px;
          border-left:5px solid var(--red); padding:.5em .9em .55em; box-shadow:0 3px 0 rgba(0,0,0,.35); }
  .news .kick { font-size:clamp(8px,1.05vw,11px); font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--red); }
  .news .hl { font-family:Georgia, "Times New Roman", serif; font-weight:700; font-size:clamp(13px,2vw,21px); line-height:1.15; margin:.15em 0 .2em; }
  .news p { margin:0; font-size:clamp(10px,1.3vw,14px); line-height:1.35; max-width:none; color:#333; }
  .news a { color:var(--red); font-weight:800; white-space:nowrap; }
  #rotate { position:fixed; top:6px; left:0; right:0; text-align:center; font-size:13px; opacity:.75; display:none; }
  @media (orientation:portrait) and (max-width:700px) { #rotate { display:block; } }
</style>
</head>
<body>
<div id="rotate">Turn your phone sideways for a bigger view</div>
<div id="wrap">
  <canvas id="c" width="960" height="540" aria-label="Suds Run game"></canvas>
  <div id="topbtns">
    <button class="small ghost hidden" id="btnPause" aria-label="Pause">❚❚</button>
    <button class="small ghost" id="btnMute" aria-label="Toggle sound">🔊</button>
  </div>
  <div id="fctl" class="hidden">
    <button id="btnPour">Hold to pour 🫧</button>
    <button id="btnRun">Make a run for it →</button>
  </div>
  <div id="overlay"><div id="panel"></div></div>
</div>

<script>
(() => {
'use strict';

/* ================= Editable content ================= */
const FOUNTAIN_NAME = 'BROYHILL FOUNTAIN';
const BUS_LABEL = 'LINCOLN';

const COLORS = [
  { id:'classic', name:'Classic Suds',  need:0,    c:'#ffffff' },
  { id:'red',     name:'Husker Red',    need:200,  c:'#ff3b3f' },
  { id:'blue',    name:'Pool Blue',     need:450,  c:'#5cc8ff' },
  { id:'green',   name:'Scooter Green', need:750,  c:'#7be35a' },
  { id:'purple',  name:'Purple Haze',   need:1100, c:'#b98aff' },
  { id:'gold',    name:'Gold',          need:1600, c:'#ffd23f' },
  { id:'rainbow', name:'Rainbow',       need:2300, c:null },
];

// General facts only. Swap in reported, attributed numbers once we have them (see PLAN.md, section 6).
const FACTS = [
  'Soap foam can clog a fountain’s pumps and filters. The usual fix is shutting it off, draining it and cleaning it out.',
  'Draining and refilling a fountain sends a whole basin of water down the drain.',
  'Cleanup isn’t automatic. Facilities staff have to drop their other work to deal with it.',
  'In Nebraska, damaging property can be charged as criminal mischief, and the penalty goes up with the cost of the damage.',
  'Students can also get a university conduct referral, separate from anything the police do.',
  'Foam spilling onto the plaza makes the pavement slick. That’s an easy fall for someone walking to class.',
  'Detergent and dye can stain stone and leave residue that takes more than a quick rinse to remove.',
  'While the fountain is shut down for cleaning, nobody on campus gets to enjoy it.',
];

/* ================= Setup ================= */
const W = 960, H = 540;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const overlay = document.getElementById('overlay'), panel = document.getElementById('panel');
const fctl = document.getElementById('fctl'), btnPour = document.getElementById('btnPour'), btnRun = document.getElementById('btnRun');
const btnMute = document.getElementById('btnMute'), btnPause = document.getElementById('btnPause');
let dpr = 1;
function resize(){ dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = W*dpr; cv.height = H*dpr; }
resize(); window.addEventListener('resize', resize);

const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.random()*a.length|0];
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const isTouch = window.matchMedia && matchMedia('(pointer:coarse)').matches;

const store = {
  get(k,d){ try { const v = localStorage.getItem('sudsrun.'+k); return v==null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k,v){ try { localStorage.setItem('sudsrun.'+k, JSON.stringify(v)); } catch(e){} },
};
let best = store.get('best', 0) || 0;
let colorId = store.get('color', 'classic');
let muted = !!store.get('muted', false);
let factIdx = store.get('fact', 0) || 0;
if (!COLORS.some(c => c.id===colorId && best>=c.need)) colorId = 'classic';

/* ================= Audio ================= */
let actx = null;
function audio(){
  if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ actx = null; } }
  if (actx && actx.state==='suspended') actx.resume();
  return actx;
}
function tone(f1,f2,dur,type='sine',vol=.12,delay=0){
  if (muted) return; const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.03);
}
const sfx = {
  jump: () => tone(320,720,.16,'square',.06),
  slide:() => tone(520,160,.2,'triangle',.1),
  pop:  () => tone(900+Math.random()*500,1900,.07,'sine',.08),
  blub: () => tone(180+Math.random()*220,520,.06,'sine',.05),
  hit:  () => tone(170,60,.32,'sawtooth',.12),
  siren:(n=3) => { for (let i=0;i<n;i++){ tone(640,960,.34,'sawtooth',.035,i*.68); tone(960,640,.34,'sawtooth',.035,i*.68+.34); } },
};
function setMuteIcon(){ btnMute.textContent = muted ? '🔇' : '🔊'; }
setMuteIcon();
btnMute.addEventListener('click', () => { muted = !muted; store.set('muted', muted); setMuteIcon(); if (!muted) audio(); });

/* ================= Colors ================= */
function curColor(){ return COLORS.find(c=>c.id===colorId) || COLORS[0]; }
let clock = 0;
function sudsColor(i){ const c = curColor(); return c.c || `hsl(${(i*61 + clock*40)%360},90%,74%)`; }

/* ================= Input ================= */
const keys = { left:false, right:false, up:false, down:false, pour:false };
const pointer = { down:false, x:0, y:0, sx:0, sy:0, used:false, id:null };
let pourBtn = false;
function canvasXY(e){ const r = cv.getBoundingClientRect(); return [ (e.clientX-r.left)*W/r.width, (e.clientY-r.top)*H/r.height ]; }

window.addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k) && overlay.classList.contains('hidden')) e.preventDefault();
  if (state==='fountain') {
    if (k==='ArrowLeft'||k==='a'||k==='A') keys.left = true;
    if (k==='ArrowRight'||k==='d'||k==='D') keys.right = true;
    if (k==='ArrowUp'||k==='w'||k==='W') keys.up = true;
    if (k==='ArrowDown'||k==='s'||k==='S') keys.down = true;
    if (k===' ') keys.pour = true;
    if (k==='Enter'||k==='r'||k==='R') startAlert();
  } else if (state==='run' && !paused) {
    if (e.repeat) return;
    if (k==='ArrowLeft'||k==='a'||k==='A') moveLane(-1);
    if (k==='ArrowRight'||k==='d'||k==='D') moveLane(1);
    if (k==='ArrowUp'||k==='w'||k==='W'||k===' ') jump();
    if (k==='ArrowDown'||k==='s'||k==='S') slide();
    if (k==='p'||k==='P'||k==='Escape') setPaused(true);
  } else if (state==='run' && paused && (k==='p'||k==='P'||k==='Escape'||k===' ')) setPaused(false);
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k==='ArrowLeft'||k==='a'||k==='A') keys.left = false;
  if (k==='ArrowRight'||k==='d'||k==='D') keys.right = false;
  if (k==='ArrowUp'||k==='w'||k==='W') keys.up = false;
  if (k==='ArrowDown'||k==='s'||k==='S') keys.down = false;
  if (k===' ') keys.pour = false;
});
window.addEventListener('blur', () => { for (const k in keys) keys[k]=false; pourBtn=false; pointer.down=false; if (state==='run') setPaused(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state==='run') setPaused(true); });

cv.addEventListener('pointerdown', e => {
  audio();
  const [x,y] = canvasXY(e);
  pointer.down = true; pointer.id = e.pointerId; pointer.x = pointer.sx = x; pointer.y = pointer.sy = y; pointer.used = false;
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
});
cv.addEventListener('pointermove', e => {
  if (!pointer.down || e.pointerId!==pointer.id) return;
  const [x,y] = canvasXY(e); pointer.x = x; pointer.y = y;
  if (state==='run' && !paused && !pointer.used) {
    const dx = x-pointer.sx, dy = y-pointer.sy;
    if (Math.hypot(dx,dy) > 34) {
      pointer.used = true;
      if (Math.abs(dx) > Math.abs(dy)) moveLane(dx>0?1:-1); else if (dy<0) jump(); else slide();
    }
  }
});
function endPointer(e){
  if (e.pointerId!==pointer.id) return;
  if (state==='run' && !paused && !pointer.used) jump();
  pointer.down = false;
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', e => { if (e.pointerId===pointer.id) pointer.down=false; });

btnPour.addEventListener('pointerdown', e => { e.preventDefault(); audio(); pourBtn = true; try{btnPour.setPointerCapture(e.pointerId);}catch(err){} });
['pointerup','pointercancel','pointerleave'].forEach(ev => btnPour.addEventListener(ev, () => { pourBtn = false; }));
btnPour.addEventListener('contextmenu', e => e.preventDefault());
btnRun.addEventListener('click', () => startAlert());
btnPause.addEventListener('click', () => setPaused(!paused));

/* ================= Game state ================= */
let state = 'title';   // title | fountain | alert | run | caught | over
let paused = false;
let alertT = 0, caughtT = 0;
let lastCoverage = 0;
const toasts = [];
function toast(text, dur=3){ toasts.push({ text, t:dur, max:dur }); }

/* ================= FOUNTAIN ================= */
// Broyhill Fountain: a long curved basin with granite slabs, one tall jet and a row of
// small bubblers, on the plaza in front of the Nebraska Union.
const FT = { cx:480, cy:325, rx:330, ry:158 };
function edgeK(a){ return 1 + .05*Math.sin(3*a+1) + .035*Math.sin(5*a+2); }
function poolD(x,y){ const dx=(x-FT.cx)/FT.rx, dy=(y-FT.cy)/FT.ry; return Math.hypot(dx,dy)/edgeK(Math.atan2(dy,dx)); } // < 1 = in the water
function poolPath(s){
  ctx.beginPath();
  for (let i=0;i<=96;i++){ const a=i/96*Math.PI*2, k=edgeK(a)*s, x=FT.cx+FT.rx*k*Math.cos(a), y=FT.cy+FT.ry*k*Math.sin(a); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath();
}
let seed = 11; const srand = () => { seed = (seed*16807) % 2147483647; return seed/2147483647; };
function makeRock(x,y,r,steps,squash,rot){
  const n = 6 + (srand()*3|0), pts = [];
  for (let i=0;i<n;i++){ const a = rot + i/n*Math.PI*2 + srand()*.35, rr = r*(.8+srand()*.3); pts.push([Math.cos(a)*rr, Math.sin(a)*rr*squash]); }
  const specks = []; for (let i=0;i<14;i++) specks.push([(srand()-.5)*r*1.1, (srand()-.5)*r*squash*1.1, srand()<.5]);
  return { x, y, r, rc:r*Math.max(.7,squash)*.85, pts, steps, specks, tilt:(srand()-.5)*.6 };
}
const ROCKS = [
  makeRock(330,300,42,true,.8,.3),
  makeRock(458,280,30,false,1.15,1),
  makeRock(232,368,38,true,.75,0),
  makeRock(690,330,44,false,.6,.5),
  makeRock(408,410,22,false,.9,2),
  makeRock(792,262,42,true,.7,.2),   // sits on the rim
  makeRock(176,262,34,false,.8,1.4), // sits on the rim
];
const JETS = [{ x:505, y:300, tall:true, acc:0 }];
for (let i=0;i<6;i++) JETS.push({ x:548+i*28, y:430-i*6, tall:false, acc:srand() });

const CELL = 10, GX = 72, GY = 38, ox = FT.cx - GX*CELL/2, oy = FT.cy - 190;
const NC = GX*GY;
const foam = new Float32Array(NC), tmp = new Float32Array(NC), mask = new Uint8Array(NC);
const jx = new Float32Array(NC), jy = new Float32Array(NC), jr = new Float32Array(NC), jb = new Uint8Array(NC);
let waterCells = 0;
for (let j=0;j<GY;j++) for (let i=0;i<GX;i++) {
  const k = j*GX+i, x = ox+(i+.5)*CELL, y = oy+(j+.5)*CELL, d = poolD(x,y);
  if (i===0||j===0||i===GX-1||j===GY-1) mask[k]=0;
  else if (ROCKS.some(r => Math.hypot(x-r.x, y-r.y) < r.rc)) mask[k]=0;
  else if (d < .97) { mask[k]=1; waterCells++; }
  else if (d < 1.13) mask[k]=2;
  jx[k]=rand(-4,4); jy[k]=rand(-4,4); jr[k]=rand(.8,1.25); jb[k]=Math.random()*6|0;
}
const sw = { x:FT.cx, y:FT.cy+120, vx:0, vy:0, ang:-Math.PI/2, stroke:0, poured:0, rip:0 };
let coverage = 0, fMsg = 0;
const ripples = [], drops = [], jets = [], airB = [];

function resetFountain(){
  foam.fill(0); coverage = 0; fMsg = 0;
  Object.assign(sw, { x:FT.cx, y:FT.cy+120, vx:0, vy:0, ang:-Math.PI/2, stroke:0, poured:0 });
  ripples.length = drops.length = airB.length = 0;
}
function addFoam(x,y,rad,amt){
  const i0 = Math.max(1, Math.floor((x-rad-ox)/CELL)), i1 = Math.min(GX-2, Math.floor((x+rad-ox)/CELL));
  const j0 = Math.max(1, Math.floor((y-rad-oy)/CELL)), j1 = Math.min(GY-2, Math.floor((y+rad-oy)/CELL));
  for (let j=j0;j<=j1;j++) for (let i=i0;i<=i1;i++) {
    const k = j*GX+i; if (mask[k]!==1) continue;
    const d = Math.hypot(ox+(i+.5)*CELL-x, oy+(j+.5)*CELL-y);
    if (d<rad) foam[k] = clamp(foam[k] + amt*(1-d/rad), 0, 2);
  }
}
function stepFoam(dt){
  const D = .65*dt;
  for (let j=1;j<GY-1;j++) for (let i=1;i<GX-1;i++) {
    const k = j*GX+i, m = mask[k];
    if (!m) { tmp[k]=0; continue; }
    const a = foam[k];
    const n = (mask[k-1]?foam[k-1]:a) + (mask[k+1]?foam[k+1]:a) + (mask[k-GX]?foam[k-GX]:a) + (mask[k+GX]?foam[k+GX]:a);
    let v = a + D*(n-4*a);
    if (m===1) { if (a>.2 && a<1.35) v += .11*dt; v -= .003*dt; }
    else v -= .05*dt;
    tmp[k] = clamp(v,0,2);
  }
  foam.set(tmp);
}
function updateFountain(dt){
  let ax=0, ay=0;
  if (state==='fountain') {
    if (keys.left) ax-=1; if (keys.right) ax+=1; if (keys.up) ay-=1; if (keys.down) ay+=1;
    if (pointer.down) { const dx=pointer.x-sw.x, dy=pointer.y-sw.y, d=Math.hypot(dx,dy); if (d>10){ ax=dx/d; ay=dy/d; } }
    const l = Math.hypot(ax,ay); if (l>0){ ax/=l; ay/=l; }
  }
  sw.vx += ax*430*dt; sw.vy += ay*430*dt;
  const k = Math.exp(-2.4*dt); sw.vx*=k; sw.vy*=k;
  let sp = Math.hypot(sw.vx,sw.vy); if (sp>180){ sw.vx*=180/sp; sw.vy*=180/sp; sp=180; }
  sw.x += sw.vx*dt; sw.y += sw.vy*dt;
  // stay in the basin
  const pd = poolD(sw.x, sw.y), LIM = .88;
  if (pd > LIM) {
    sw.x = FT.cx + (sw.x-FT.cx)*LIM/pd; sw.y = FT.cy + (sw.y-FT.cy)*LIM/pd;
    let nx = (sw.x-FT.cx)/(FT.rx*FT.rx), ny = (sw.y-FT.cy)/(FT.ry*FT.ry); const nl = Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
    const vn = sw.vx*nx + sw.vy*ny; if (vn>0){ sw.vx -= vn*nx*1.5; sw.vy -= vn*ny*1.5; }
  }
  // bump off the granite
  for (const r of ROCKS) {
    const dx = sw.x-r.x, dy = sw.y-r.y, d = Math.hypot(dx,dy)||1, min = r.rc + 14;
    if (d < min) { const nx=dx/d, ny=dy/d; sw.x = r.x+nx*min; sw.y = r.y+ny*min; const vn = sw.vx*nx+sw.vy*ny; if (vn<0){ sw.vx -= vn*nx*1.5; sw.vy -= vn*ny*1.5; } }
  }
  if (sp>10) { const ta=Math.atan2(sw.vy,sw.vx); let da=ta-sw.ang; while(da>Math.PI)da-=2*Math.PI; while(da<-Math.PI)da+=2*Math.PI; sw.ang+=da*Math.min(1,dt*6); }
  sw.stroke += dt*(1.5+sp/40);
  sw.rip -= dt;
  if (sw.rip<=0 && sp>25) { sw.rip=.18; ripples.push({ x:sw.x-Math.cos(sw.ang)*16, y:sw.y-Math.sin(sw.ang)*16, r:8, a:.45 }); }

  const pouring = state==='fountain' && (keys.pour || pourBtn);
  if (pouring) {
    sw.poured += dt;
    const hx = sw.x+Math.cos(sw.ang)*20, hy = sw.y+Math.sin(sw.ang)*20;
    addFoam(hx, hy, 32, 3.6*dt);
    if (Math.random()<dt*12) sfx.blub();
    if (Math.random()<dt*30) drops.push({ x:hx+rand(-4,4), y:hy+rand(-4,4), r:2, a:1 });
    if (Math.random()<dt*10) airB.push({ x:hx+rand(-15,15), y:hy+rand(-15,15), r:rand(3,8), t:0, life:rand(1,2.4), i:Math.random()*99|0 });
    if (fMsg===0){ fMsg=1; toast('The water’s getting frothy…'); }
  }
  if (sp>60) addFoam(sw.x, sw.y, 14, -.5*dt*(sp/180));
  stepFoam(dt);

  let c=0; for (let i=0;i<NC;i++) if (mask[i]===1 && foam[i]>.35) c++;
  coverage = c/waterCells;
  if (fMsg===1 && coverage>.25){ fMsg=2; toast('The pump is starting to gurgle…'); }
  if (fMsg===2 && coverage>.5){ fMsg=3; toast('Half the fountain is foam. Someone’s filming from the Union steps.'); }
  if (fMsg===3 && coverage>.72){ fMsg=4; toast('Foam is spilling onto the plaza.'); }
  if (fMsg===4 && coverage>.92){ fMsg=5; toast('Broyhill is basically a bubble bath now.'); }

  for (let i=ripples.length-1;i>=0;i--){ const r=ripples[i]; r.r+=30*dt; r.a-=.5*dt; if (r.a<=0) ripples.splice(i,1); }
  for (let i=drops.length-1;i>=0;i--){ const p=drops[i]; p.r+=20*dt; p.a-=2*dt; if (p.a<=0) drops.splice(i,1); }
  for (let i=airB.length-1;i>=0;i--){ const b=airB[i]; b.t+=dt; b.y-=6*dt; if (b.t>b.life){ airB.splice(i,1); if (Math.random()<.3) sfx.pop(); } }
  // jets: one tall spout plus a row of little bubblers
  for (const s of JETS) {
    s.acc += dt * (s.tall ? 80 : 9);
    while (s.acc >= 1) { s.acc -= 1;
      const a = rand(0,Math.PI*2), v = s.tall ? rand(4,16) : rand(2,7);
      jets.push({ x:s.x, y:s.y, vx:Math.cos(a)*v, vy:Math.sin(a)*v*.6, h:0, vh: s.tall ? rand(270,320) : rand(55,75), r: s.tall ? rand(2,3.4) : rand(1.6,2.6) });
    }
  }
  for (let i=jets.length-1;i>=0;i--){ const j=jets[i]; j.x+=j.vx*dt; j.y+=j.vy*dt; j.vh-=330*dt; j.h+=j.vh*dt;
    if (j.h<0){ jets.splice(i,1); if (Math.random()<.06) ripples.push({ x:j.x, y:j.y, r:3, a:.3 }); } }
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// Nebraska Union, front elevation: red-brick wings, pale limestone center block with two towers,
// curved parapet with the name, balcony windows, "There is No Place Like Nebraska" sign over the
// main doors with two red N banners, brick-filled arches, red patio umbrellas and a banner lamp post.
function drawUnion(){
  const TOP = 100, LS = '#dcd0b7', LSd = '#c9bb9e', BR = '#a3473a';
  const sky = ctx.createLinearGradient(0,0,0,30); sky.addColorStop(0,'#9fd0ee'); sky.addColorStop(1,'#cfe7f5');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,TOP);
  // brick wings
  ctx.fillStyle = BR; ctx.fillRect(0,14,W,TOP-14);
  ctx.strokeStyle = 'rgba(70,20,15,.16)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let y=18;y<TOP;y+=5){ ctx.moveTo(0,y); ctx.lineTo(W,y); } ctx.stroke();
  ctx.fillStyle = LS; ctx.fillRect(0,12,W,4);            // cornice
  ctx.fillStyle = LSd; ctx.fillRect(0,52,W,4);           // belt course
  // tall white multi-pane windows on the second floor
  const win = (x,y,w,h) => {
    ctx.fillStyle = '#f4f2ec'; ctx.fillRect(x,y,w,h);
    ctx.fillStyle = '#6e8ea6'; ctx.fillRect(x+3,y+3,w-6,h-6);
    ctx.fillStyle = '#f4f2ec';
    ctx.fillRect(x+w/3-1,y+3,2,h-6); ctx.fillRect(x+2*w/3-1,y+3,2,h-6); ctx.fillRect(x+3,y+h/2-1,w-6,2);
    ctx.fillStyle = LS; ctx.fillRect(x-3,y+h,w+6,3);
  };
  for (let x=20; x<300; x+=70) win(x,20,40,28);
  for (let x=660; x<W; x+=70) win(x,20,40,28);
  // ground floor: brick arches with glass behind (right wing), square windows (left wing)
  for (let x=14; x<300; x+=70) { ctx.fillStyle = LSd; ctx.fillRect(x-4,58,6,TOP-58); ctx.fillStyle = '#41505a'; ctx.fillRect(x+8,64,36,TOP-64); ctx.fillStyle='#7f9db1'; ctx.fillRect(x+11,67,30,14); }
  for (let x=654; x<W; x+=70) {
    ctx.fillStyle = '#8e3c31'; ctx.fillRect(x,58,60,TOP-58);
    ctx.fillStyle = '#41505a'; ctx.beginPath(); ctx.moveTo(x+8,TOP); ctx.lineTo(x+8,74); ctx.arc(x+30,74,22,Math.PI,0); ctx.lineTo(x+52,TOP); ctx.fill();
    ctx.strokeStyle = '#c9bb9e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x+30,74,24,Math.PI,0); ctx.stroke();
    ctx.fillStyle = '#7f9db1'; ctx.fillRect(x+13,76,34,10);
  }
  // limestone center block
  const L = 318, Rx = 642;
  ctx.fillStyle = LS; ctx.fillRect(L,4,Rx-L,TOP-4);
  // towers (slightly proud of the center) with a brick panel up top
  for (const tx of [L, Rx-72]) {
    ctx.fillStyle = '#e2d7c0'; ctx.fillRect(tx,2,72,TOP-2);
    ctx.strokeStyle = 'rgba(120,100,70,.25)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let y=10;y<TOP;y+=9){ ctx.moveTo(tx,y); ctx.lineTo(tx+72,y); } ctx.stroke();
    ctx.fillStyle = BR; ctx.fillRect(tx+22,6,28,9);
    win(tx+18,22,36,26);
    // brick-filled arch at the base
    ctx.fillStyle = LSd; ctx.beginPath(); ctx.moveTo(tx+10,TOP); ctx.lineTo(tx+10,72); ctx.arc(tx+36,72,26,Math.PI,0); ctx.lineTo(tx+62,TOP); ctx.fill();
    ctx.fillStyle = BR; ctx.beginPath(); ctx.moveTo(tx+14,TOP); ctx.lineTo(tx+14,72); ctx.arc(tx+36,72,22,Math.PI,0); ctx.lineTo(tx+58,TOP); ctx.fill();
    ctx.strokeStyle = 'rgba(70,20,15,.2)'; ctx.beginPath(); for (let y=56;y<TOP;y+=5){ ctx.moveTo(tx+14,y); ctx.lineTo(tx+58,y); } ctx.stroke();
  }
  // recessed, curved middle with the name
  const mL = L+72, mR = Rx-72;
  ctx.fillStyle = '#d3c6aa'; ctx.beginPath(); ctx.moveTo(mL,14); ctx.quadraticCurveTo((mL+mR)/2,8,mR,14); ctx.lineTo(mR,58); ctx.lineTo(mL,58); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8e2f25'; ctx.font = 'bold 10px Georgia, serif'; ctx.textAlign = 'center';
  ctx.fillText('N E B R A S K A   U N I O N', (mL+mR)/2, 23);
  for (let i=0;i<3;i++) win(mL+14+i*38, 28, 30, 20);
  ctx.strokeStyle = '#8b8f93'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(mL+6,50); ctx.lineTo(mR-6,50);
  for (let x=mL+8;x<mR-6;x+=6){ ctx.moveTo(x,50); ctx.lineTo(x,55); } ctx.stroke();
  // sign band + entrance with two red N banners
  ctx.fillStyle = '#efe9dc'; ctx.fillRect(mL+4,60,mR-mL-8,8);
  ctx.fillStyle = '#b3241b'; ctx.font = 'bold 6px Georgia, serif'; ctx.fillText('THERE IS NO PLACE LIKE NEBRASKA', (mL+mR)/2, 66.5);
  ctx.fillStyle = '#2f3a42'; ctx.fillRect(mL+8,69,mR-mL-16,TOP-69);
  ctx.fillStyle = '#9fb9c9'; for (let x=mL+12; x<mR-12; x+=14) ctx.fillRect(x,86,10,TOP-86);
  for (const bx of [mL+28, mR-58]) {
    ctx.fillStyle = '#c8102e'; ctx.fillRect(bx,70,30,15);

  }

  ctx.fillStyle = '#cbc4b6'; ctx.fillRect(0,TOP,W,14);
  ctx.strokeStyle = '#b3ab9c'; ctx.lineWidth = 1; ctx.beginPath();
  for (const y of [TOP+4,TOP+8,TOP+12]) { ctx.moveTo(L-20,y); ctx.lineTo(Rx+20,y); } ctx.stroke();
  // lamp post with red banners (right of the entrance)
  ctx.fillStyle = '#4a4a4a'; ctx.fillRect(694,40,4,80);
  ctx.fillStyle = '#f4ecd0'; ctx.beginPath(); ctx.arc(696,38,5,0,7); ctx.fill();
  ctx.fillStyle = '#c8102e'; ctx.fillRect(679,50,14,22); ctx.fillRect(699,50,14,22);

}

function drawPlaza(){
  ctx.fillStyle = '#e3ded2'; ctx.fillRect(0,0,W,H);

}

function rockPath(r, s, ox2, oy2){ ctx.beginPath(); r.pts.forEach(([x,y],i) => { const px=x*s+ox2, py=y*s+oy2; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }); ctx.closePath(); }
function drawRock(r){
  ctx.save(); ctx.translate(r.x, r.y);
  ctx.fillStyle = 'rgba(0,0,0,.22)'; rockPath(r,1,9,12); ctx.fill();
  ctx.fillStyle = '#7d6866'; rockPath(r,1,0,0); ctx.fill();
  const tx = -r.r*.06, ty = -r.r*.24;
  ctx.fillStyle = '#a99390'; rockPath(r,.84,tx,ty); ctx.fill();
  ctx.save(); rockPath(r,.84,tx,ty); ctx.clip();
  if (r.steps) {
    ctx.rotate(r.tilt); ctx.lineWidth = 3;
    for (let y=-r.r; y<r.r; y+=7){ ctx.strokeStyle = (y/7|0)%2 ? 'rgba(70,50,48,.35)' : 'rgba(230,215,210,.35)'; ctx.beginPath(); ctx.moveTo(-r.r*1.3,y); ctx.lineTo(r.r*1.3,y); ctx.stroke(); }
  } else {
    ctx.fillStyle = 'rgba(255,240,235,.18)'; ctx.beginPath(); ctx.ellipse(-r.r*.25,-r.r*.25,r.r*.4,r.r*.22,-.5,0,7); ctx.fill();
  }
  ctx.restore();
  for (const [x,y,light] of r.specks){ ctx.fillStyle = light ? 'rgba(235,220,215,.55)' : 'rgba(80,60,58,.45)'; ctx.fillRect(x+tx, y+ty, 2, 2); }
  ctx.restore();
}

function drawFountain(){
  drawPlaza();
  // rim
  ctx.save(); ctx.translate(6,8); poolPath(1.09); ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fill(); ctx.restore();
  poolPath(1.09); ctx.fillStyle='#d2cbbd'; ctx.fill(); ctx.strokeStyle='#b1a999'; ctx.lineWidth=2; ctx.stroke();
  poolPath(1.0); const g = ctx.createRadialGradient(FT.cx,FT.cy,30,FT.cx,FT.cy,FT.rx);
  g.addColorStop(0,'#4fa6b6'); g.addColorStop(1,'#2a6d7e'); ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='#8c8476'; ctx.lineWidth=3; ctx.stroke();
  // shimmer + ripples
  ctx.save(); poolPath(1.0); ctx.clip();
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=2;
  for (let i=0;i<8;i++){ const yy = FT.cy-FT.ry + i*44 + Math.sin(clock*1.3+i)*6; ctx.beginPath();
    for (let x=FT.cx-FT.rx-20;x<=FT.cx+FT.rx+20;x+=16) ctx.lineTo(x, yy+Math.sin(x*.05+clock*2+i)*4); ctx.stroke(); }
  for (const r of ripples){ ctx.strokeStyle=`rgba(255,255,255,${r.a})`; ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,7); ctx.stroke(); }
  for (const p of drops){ ctx.strokeStyle=`rgba(255,255,255,${p.a})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.stroke(); }
  ctx.restore();
  // jet nozzles
  for (const s of JETS){ ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(s.x,s.y, s.tall?11:6, s.tall?6:3.5, 0,0,7); ctx.fill(); }

  drawFoam();
  for (const r of ROCKS) drawRock(r);
  drawSwimmer();
  // spray (drawn with height so the tall jet reads as a column)
  ctx.fillStyle='rgba(255,255,255,.85)'; ctx.beginPath();
  for (const j of jets){ const y = j.y - j.h*.55; ctx.moveTo(j.x+j.r, y); ctx.arc(j.x, y, j.r, 0, 7); }
  ctx.fill();
  for (const b of airB){ const a = 1 - b.t/b.life, rr = b.r*(1+b.t*.4);
    ctx.strokeStyle = sudsColor(b.i); ctx.globalAlpha=a; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(b.x,b.y,rr,0,7); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x-rr*.35,b.y-rr*.35,rr*.25,0,7); ctx.fill(); ctx.globalAlpha=1; }

  // plaque
  ctx.fillStyle='#8a8070'; roundRect(FT.cx-82, 121, 164, 20, 5); ctx.fill();
  ctx.fillStyle='#f4ecd8'; ctx.font='bold 12px Verdana'; ctx.textAlign='center'; ctx.fillText(FOUNTAIN_NAME, FT.cx, 135);
  drawSign();
}

function drawFoam(){
  const t = clock;
  const rainbow = !curColor().c;
  const passes = [
    { fill:'rgba(0,0,0,.10)', dx:2, dy:3, rs:1.05 },
    { fill:null, dx:0, dy:0, rs:1 },
  ];
  for (const p of passes){
    if (p.fill || !rainbow) {
      ctx.fillStyle = p.fill || curColor().c; ctx.globalAlpha = p.fill ? 1 : .92;
      ctx.beginPath(); foamPath(-1, p, t); ctx.fill();
    } else {
      ctx.globalAlpha=.92;
      for (let b=0;b<6;b++){ ctx.fillStyle=`hsl(${(b*60+t*30)%360},90%,76%)`; ctx.beginPath(); foamPath(b,p,t); ctx.fill(); }
    }
  }
  ctx.globalAlpha=.85; ctx.fillStyle='#fff'; ctx.beginPath();
  for (let k=0;k<NC;k++){ const a=foam[k]; if (a<.25||!mask[k]) continue;
    const i=k%GX, j=(k/GX)|0, r=(3+Math.min(a,1.6)*5)*jr[k];
    const x=ox+(i+.5)*CELL+jx[k]+Math.sin(t*1.5+k)*1.2-r*.35, y=oy+(j+.5)*CELL+jy[k]-r*.4;
    ctx.moveTo(x+r*.3,y); ctx.arc(x,y,r*.3,0,7); }
  ctx.fill(); ctx.globalAlpha=1;
}
function foamPath(bucket, p, t){
  for (let k=0;k<NC;k++){
    const a=foam[k]; if (a<.06||!mask[k]) continue;
    if (bucket>=0 && jb[k]!==bucket) continue;
    const i=k%GX, j=(k/GX)|0, r=(3+Math.min(a,1.6)*5)*jr[k]*p.rs;
    const x=ox+(i+.5)*CELL+jx[k]+Math.sin(t*1.5+k)*1.2+p.dx, y=oy+(j+.5)*CELL+jy[k]+p.dy;
    ctx.moveTo(x+r,y); ctx.arc(x,y,r,0,7);
  }
}

function drawSwimmer(){
  const s = sw, sp = Math.hypot(s.vx,s.vy), pouring = state==='fountain' && (keys.pour||pourBtn);
  ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.ang);
  // body under water
  ctx.globalAlpha=.55;
  ctx.strokeStyle='#e7b088'; ctx.lineWidth=6; ctx.lineCap='round';
  const kick = Math.sin(s.stroke*9)*5;
  ctx.beginPath(); ctx.moveTo(-20,-5); ctx.lineTo(-40,-6+kick); ctx.moveTo(-20,5); ctx.lineTo(-40,6-kick); ctx.stroke();
  ctx.fillStyle='#d00000'; ctx.beginPath(); ctx.ellipse(-8,0,16,11,0,0,7); ctx.fill();
  ctx.globalAlpha=1;
  // arms
  ctx.strokeStyle='#e7b088'; ctx.lineWidth=5;
  if (pouring) {
    ctx.beginPath(); ctx.moveTo(0,-9); ctx.lineTo(18,-6); ctx.moveTo(0,9); ctx.lineTo(18,6); ctx.stroke();
    ctx.fillStyle='#fff'; roundRect(16,-8,14,16,3); ctx.fill(); ctx.strokeStyle='#999'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='#2a8fc9'; ctx.fillRect(18,-3,10,6); ctx.fillStyle='#d00000'; ctx.fillRect(29,-3,4,6);
  } else {
    const a = s.stroke*4;
    const l = Math.cos(a), r = Math.cos(a+Math.PI);
    ctx.beginPath(); ctx.moveTo(0,-9); ctx.lineTo(4+l*20,-12-Math.abs(Math.sin(a))*4);
    ctx.moveTo(0,9); ctx.lineTo(4+r*20,12+Math.abs(Math.sin(a+Math.PI))*4); ctx.stroke();
  }
  // head
  ctx.fillStyle='#e7b088'; ctx.beginPath(); ctx.arc(4,0,9,0,7); ctx.fill();
  ctx.fillStyle='#4a2c1a'; ctx.beginPath(); ctx.arc(2,0,9,Math.PI*.55,Math.PI*1.45); ctx.lineTo(6,0); ctx.fill();
  ctx.beginPath(); ctx.ellipse(1,0,7,8.5,0,0,7); ctx.fill();
  ctx.restore();
  if (sp<12 && !pouring) { // treading water ring
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(s.x,s.y,16+Math.sin(clock*4)*2,0,7); ctx.stroke();
  }
}

/* ================= RUN ================= */
const PZ = 4.5, FOC = 448, CAMH = 2.5, HOR = 190, ZN = .6, ZF = 78, LANE = 1.6, ROADW = 2.7;
const GRAV = 34, JUMPV = 10.4, SLIDE_T = .72;
// [street wall, end wall, brick?]: mostly red brick like the Colonial/Georgian Revival houses on R and 16th,
// plus tan brick, painted white and grey stone
const HOUSE_COLS = [['#a8433a','#b9584b',true],['#9c3d31','#ad4c40',true],['#b05e3c','#c06d4a',true],['#c9a77a','#d8b88b',true],['#efe9dc','#f7f3ea',false],['#8f8a84','#a19c95',false]];
// Each side of the street switches house style every 2–3 houses
const STYLE_COLS = {
  colonial: HOUSE_COLS,
  tudor:  [['#9c3d31','#ad4c40',true],['#8f8a84','#a19c95',false],['#a8433a','#b9584b',true]],
  porch:  [['#e8dfc8','#efe7d3','siding'],['#cfd8c3','#d9e1ce','siding'],['#f1e3b1','#f5eac3','siding'],['#d6dee4','#e0e7ec','siding']],
};
const HOUSE_STYLES = Object.keys(STYLE_COLS);
const styleRun = { '-1':{ style:'colonial', left:0 }, '1':{ style:'colonial', left:0 } };
function nextStyle(side){
  const r = styleRun[side];
  if (r.left <= 0) { let n; do n = pick(HOUSE_STYLES); while (n === r.style); r.style = n; r.left = 2 + (Math.random()*2|0); }
  r.left--; return r.style;
}
// Housed chapters from UNL Fraternity & Sorority Life (fsl.unl.edu, IFC and PHA lists, Nov. 2026).
// Chapters without Greek letters are spelled out. Each run deals them out in a shuffled order.
const HOUSE_NAMES = [
  // IFC fraternities
  'ACACIA',  // Acacia
  'ΑΓΡ',     // Alpha Gamma Rho
  'ΑΓΣ',     // Alpha Gamma Sigma
  'ΑΤΩ',     // Alpha Tau Omega
  'ΒΘΠ',     // Beta Theta Pi
  'ΔΥ',      // Delta Upsilon
  'FARMHOUSE',
  'ΦΔΘ',     // Phi Delta Theta
  'ΦΓΔ',     // Phi Gamma Delta
  'ΦΚΘ',     // Phi Kappa Theta
  'ΦΚΨ',     // Phi Kappa Psi
  'ΣΑΕ',     // Sigma Alpha Epsilon
  'ΣΧ',      // Sigma Chi
  'ΣΦΕ',     // Sigma Phi Epsilon
  'ΘΞ',      // Theta Xi
  'TRIANGLE',
  // PHA sororities
  'ΑΧΩ',     // Alpha Chi Omega
  'ΑΟΠ',     // Alpha Omicron Pi
  'ΑΦ',      // Alpha Phi
  'ΑΞΔ',     // Alpha Xi Delta
  'ΧΩ',      // Chi Omega
  'ΔΔΔ',     // Delta Delta Delta
  'ΔΓ',      // Delta Gamma
  'ΓΦΒ',     // Gamma Phi Beta
  'ΚΑΘ',     // Kappa Alpha Theta
  'ΚΔ',      // Kappa Delta
  'ΚΚΓ',     // Kappa Kappa Gamma
  'ΠΒΦ',     // Pi Beta Phi
];
let houseDeck = [];
function nextHouseName(){ if (!houseDeck.length) houseDeck = HOUSE_NAMES.slice().sort(() => Math.random()-.5); return houseDeck.pop(); }
const R = { dist:0, speed:13, lane:0, x:0, y:0, vy:0, slideT:0, stumbleT:0, bubbles:0, t:0, nextSpawn:0, cop:0, copX:1.1, hintT:0 };
const objs = [], houses = [], trees = [], parts = [];
const lastZ = { '-1':0, '1':0 };
let camX = 0, sirenFlash = 0;

function resetRun(){
  Object.assign(R, { dist:0, speed:13, lane:0, x:0, y:0, vy:0, slideT:0, stumbleT:0, bubbles:0, t:0, nextSpawn:40, cop:1, copX:1.1, hintT:5 });
  objs.length = houses.length = trees.length = parts.length = 0;
  lastZ['-1'] = rand(1,4); lastZ['1'] = rand(1,4);
  spawnScenery();
  camX = 0;
}
function spawnScenery(){
  for (const side of [-1,1]) {
    while (lastZ[side] < ZF+12) {
      const style = nextStyle(side), z = lastZ[side], col = pick(STYLE_COLS[style]), letters = nextHouseName();
      const pw = Math.max(1.4, letters.length*(/[A-Z]/.test(letters) ? .5 : .72)/2 + .35);
      const len = Math.max(rand(7,9), 2*pw + 3.4);
      houses.push({ side, z, len, style, h: style === 'modern' ? rand(5.3,5.8) : rand(4.2,4.8), col, letters, pw, lit:Math.random()<.5,
        shut:pick(['#1f3b2c','#1b1b1b','#2b3a55']), door:pick(['#6e1a1a','#1b1b1b','#22324f','#4a3022']),
        pier:pick(['#8e3c31','#8f8a84','#6b5a4a']), dormers:Math.random()<.7, chim: style !== 'modern' && Math.random()<.8 });
      trees.push({ side, z:z+len+1.3, x:side*rand(4.3,4.9), s:rand(.85,1.15) });
      lastZ[side] = z + len + 2.6;
    }
  }
}
function moveLane(d){
  const nl = clamp(R.lane+d, -1, 1); if (nl===R.lane) return; R.lane = nl;
}
function jump(){ if (R.y<=.01 && R.vy<=0) { R.vy = JUMPV; R.slideT = 0; sfx.jump(); } }
function slide(){ if (R.y>0) R.vy = -16; R.slideT = SLIDE_T; sfx.slide(); }

function addObj(o){ objs.push(o); }
function spawnRow(z){
  const d = R.dist, r = Math.random();
  if (d>350 && r<.12) { for (const l of [-1,0,1]) addObj({ type:'mascot', lane:l, z:z+(l+1)*.15, len:.3, seed:Math.random()*9 }); return 10; }
  if (d>220 && r<.24) {
    for (const l of [-1,0,1]) addObj({ type:'scooter', lane:l, z, len:.4, flip:Math.random()<.5 });
    const bl = pick([-1,0,1]);
    for (let i=0;i<7;i++){ const zz=z-3+i; addObj({ type:'bubble', lane:bl, z:zz, h:.9+Math.sin((i/6)*Math.PI)*1.3, len:.3, i:Math.random()*99|0 }); }
    return 6;
  }
  const lanes = [-1,0,1].sort(()=>Math.random()-.5);
  const free = lanes.pop();
  const n = d<150 ? 1 : (Math.random()<.55 ? 2 : 1);
  let extra = 0;
  for (let q=0;q<n;q++){
    const l = lanes[q], w = Math.random();
    if (w<.42) addObj({ type:'scooter', lane:l, z, len:.4, flip:Math.random()<.5 });
    else if (w<.68) addObj({ type:'mascot', lane:l, z, len:.3, seed:Math.random()*9 });
    else { addObj({ type:'bus', lane:l, z, len:7.5, num:pick(['402','317','24','55','44','1','27']) }); extra = 8; }
  }
  for (let i=0;i<5;i++) addObj({ type:'bubble', lane:free, z:z+i*2.2, h:.9, len:.3, i:Math.random()*99|0 });
  return extra;
}

function stumble(){
  sfx.hit(); sirenFlash = 1;
  if (R.stumbleT>0) { caught(); return; }
  R.stumbleT = 6; R.speed = Math.max(12, R.speed*.85);
  toast('Stumble! One more and you’re caught.', 2.2);
}
function caught(){
  if (state!=='run') return;
  state = 'caught'; caughtT = 0; sfx.hit(); sfx.siren(2);
  btnPause.classList.add('hidden');
}

function updateRun(dt){
  R.t += dt;
  const target = Math.min(32, 13 + R.dist*.0075);
  R.speed += (target-R.speed)*Math.min(1,dt*.8);
  const dz = R.speed*dt; R.dist += dz;
  R.x += (R.lane*LANE - R.x)*Math.min(1, dt*13);
  if (R.y>0 || R.vy>0) { R.vy -= GRAV*dt; R.y += R.vy*dt; if (R.y<=0){ R.y=0; R.vy=0; } }
  if (R.slideT>0) R.slideT -= dt;
  if (R.stumbleT>0) R.stumbleT -= dt;
  if (R.hintT>0) R.hintT -= dt;
  R.cop += ((R.stumbleT>0 ? 1 : 0) - R.cop)*Math.min(1, dt*2.2);
  const wantCopX = R.x + (R.lane>=1 ? -1.15 : 1.15); R.copX += (wantCopX-R.copX)*Math.min(1,dt*4);
  camX += (R.x*.6 - camX)*Math.min(1, dt*8);
  sirenFlash = Math.max(0, sirenFlash - dt*1.5);

  for (const h of houses) h.z -= dz; for (const t of trees) t.z -= dz; lastZ['-1'] -= dz; lastZ['1'] -= dz;
  for (let i=houses.length-1;i>=0;i--) if (houses[i].z+houses[i].len < ZN) houses.splice(i,1);
  for (let i=trees.length-1;i>=0;i--) if (trees[i].z < ZN) trees.splice(i,1);
  spawnScenery();

  while (R.dist + ZF - 8 >= R.nextSpawn) {
    const z = R.nextSpawn - R.dist + PZ;
    const extra = spawnRow(z);
    R.nextSpawn += Math.max(14, R.speed*rand(1.05,1.55)) + extra;
  }

  const sliding = R.slideT>0;
  const pTop = R.y + (sliding ? .7 : 1.7);
  for (let i=objs.length-1;i>=0;i--){
    const o = objs[i]; o.z -= dz;
    if (o.z + o.len < ZN) { objs.splice(i,1); continue; }
    if (o.hit) continue;
    const zHit = o.z - .3 < PZ + .3 && o.z + o.len + .3 > PZ - .3;
    if (!zHit) continue;
    const ox2 = o.lane*LANE;
    if (o.type==='bubble') {
      if (Math.abs(R.x-ox2) < .8 && o.h > R.y-.2 && o.h < pTop+.4) {
        o.hit = true; objs.splice(i,1); R.bubbles++; sfx.pop();
        const p = P(ox2, o.h, Math.max(o.z,ZN+.1));
        for (let q=0;q<6;q++) parts.push({ x:p.x, y:p.y, vx:rand(-80,80), vy:rand(-90,20), r:rand(2,4), t:0, life:.45, i:o.i, ring:true });
      }
      continue;
    }
    const half = o.type==='bus' ? .75 : .65;
    const overlapX = o.wide ? true : Math.abs(R.x-ox2) < half + .28;
    if (!overlapX) continue;
    if (o.type==='scooter') { if (R.y < .75) { o.hit = true; stumble(); } }
    else if (o.type==='mascot') { if (pTop > 1.05) { o.hit = true; caught(); } }
    else if (o.type==='bus') { o.hit = true; caught(); }
    if (state!=='run') break;
  }

  // soapy trail from the runner
  if (Math.random() < dt*9) {
    const p = P(R.x, R.y + (sliding?.5:1.3), PZ);
    parts.push({ x:p.x+rand(-20,20), y:p.y, vx:rand(-30,30), vy:rand(-50,-20), r:rand(3,7), t:0, life:rand(.9,1.6), i:Math.random()*99|0 });
  }
  updateParts(dt);
}
function updateParts(dt){
  for (let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if (!p.ring) p.vy += 8*dt; if (p.t>p.life) parts.splice(i,1); }
}

function P(x,y,z){ const s = FOC/z; return { x: W/2 + (x-camX)*s, y: HOR + (CAMH-y)*s, s }; }
function poly(pts, fill){ ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.closePath(); ctx.fill(); }
function gquad(x1,x2,z1,z2,fill,y=0){ z1=Math.max(z1,ZN); if (z2<=z1) return; poly([P(x1,y,z1),P(x2,y,z1),P(x2,y,z2),P(x1,y,z2)], fill); }
function vquad(x,y1,y2,z1,z2,fill){ z1=Math.max(z1,ZN); if (z2<=z1) return; poly([P(x,y1,z1),P(x,y2,z1),P(x,y2,z2),P(x,y1,z2)], fill); }

function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,HOR);
  g.addColorStop(0,'#6fbfe9'); g.addColorStop(1,'#fde3b8');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,HOR+2);
  ctx.fillStyle = 'rgba(255,240,200,.9)'; ctx.beginPath(); ctx.arc(780-camX*4, 70, 26, 0, 7); ctx.fill();
  // distant campus skyline
  const off = -camX*12;
  ctx.fillStyle = '#9fb3c4';
  const bl = [[60,30,70],[140,52,40],[190,22,90],[300,40,50],[600,26,80],[690,58,36],[740,34,70],[850,46,60]];
  for (const [x,h,w] of bl) ctx.fillRect(x+off, HOR-h, w, h);
  // stadium bowl
  ctx.fillStyle = '#8ea3b6'; ctx.beginPath(); ctx.moveTo(380+off, HOR); ctx.lineTo(390+off, HOR-44); ctx.quadraticCurveTo(480+off, HOR-60, 570+off, HOR-44); ctx.lineTo(580+off,HOR); ctx.fill();
  ctx.fillStyle = '#d00000'; ctx.fillRect(470+off, HOR-74, 3, 20); ctx.fillRect(473+off, HOR-74, 12, 8);
}
function drawGround(){
  ctx.fillStyle = '#6aa948'; ctx.fillRect(0, HOR, W, H-HOR);
  const m = R.dist % 8;
  for (let z = 8-m; z < ZF; z += 8) { gquad(-40,-ROADW-1.5,z,z+4,'#62a042'); gquad(ROADW+1.5,40,z,z+4,'#62a042'); }
  gquad(-ROADW-1.5,-ROADW,ZN,ZF,'#d3cdc0'); gquad(ROADW,ROADW+1.5,ZN,ZF,'#d3cdc0');
  const mj = R.dist % 3;
  for (let z = 3-mj; z < ZF; z += 3) { gquad(-ROADW-1.5,-ROADW,z,z+.08,'#b9b2a4'); gquad(ROADW,ROADW+1.5,z,z+.08,'#b9b2a4'); }
  gquad(-ROADW,ROADW,ZN,ZF,'#4b4c55');
  gquad(-ROADW,-ROADW+.15,ZN,ZF,'#e9e4d8'); gquad(ROADW-.15,ROADW,ZN,ZF,'#e9e4d8');
  const md = R.dist % 6;
  for (let z = 6-md; z < ZF; z += 6) { gquad(-LANE/2-.06,-LANE/2+.06,z,z+2.6,'#f3efe3'); gquad(LANE/2-.06,LANE/2+.06,z,z+2.6,'#f3efe3'); }
  // fade into distance
  const fg = ctx.createLinearGradient(0,HOR,0,HOR+24); fg.addColorStop(0,'rgba(253,227,184,.9)'); fg.addColorStop(1,'rgba(253,227,184,0)');
  ctx.fillStyle = fg; ctx.fillRect(0,HOR,W,24);
}
// The house's Greek letters across the portico frieze, drawn in perspective one letter at a time
// so they read left-to-right on both sides of the road as you run past.
function facadeName(h, xs, ylo, yhi, zA, zB){
  if (zA < ZN + .4) return;
  poly([P(xs,yhi,zA),P(xs,yhi,zB),P(xs,ylo,zB),P(xs,ylo,zA)], '#f7f3ea');
  const inset = .06;
  poly([P(xs,yhi-inset,zA+inset),P(xs,yhi-inset,zB-inset),P(xs,ylo+inset,zB-inset),P(xs,ylo+inset,zA+inset)], '#1c2a4a');
  if (FOC/zA < 7) return; // too far away to read
  const n = h.letters.length, L = /[A-Z]/.test(h.letters) ? .5 : .72, span = n*L, s0 = (zA+zB)/2 - span/2;
  // left side: near→far reads left-to-right; right side: far→near does
  const z0 = h.side < 0 ? s0 : s0 + span, dir = h.side < 0 ? 1 : -1;
  ctx.save();
  ctx.font = 'bold 82px Georgia, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#f7f3ea';
  for (let i=0;i<n;i++){
    const za = z0 + dir*i*L, zb = za + dir*L;
    const a = P(xs, yhi-.05, za), b = P(xs, yhi-.05, zb), c = P(xs, ylo+.05, za);
    ctx.setTransform(dpr*(b.x-a.x)/100, dpr*(b.y-a.y)/100, dpr*(c.x-a.x)/100, dpr*(c.y-a.y)/100, dpr*a.x, dpr*a.y);
    ctx.fillText(h.letters[i], 50, 54);
  }
  ctx.restore();
}
function screenRect(a, b, fill){ ctx.fillStyle = fill; ctx.fillRect(Math.min(a.x,b.x), Math.min(a.y,b.y), Math.abs(b.x-a.x), Math.abs(b.y-a.y)); }
const TRIM = '#f7f3ea';
// Dormer window poking out of the roof slope
function drawDormer(h, xi, top, dz){
  if (dz < ZN) return;
  const s = h.side, xd = xi + s*.6, yb = top + .5;
  vquad(xd, yb, yb+.85, dz, dz+.9, TRIM);
  vquad(xd, yb+.15, yb+.7, dz+.2, dz+.7, h.lit ? '#ffe7a3' : '#2f4152');
  sidePoly(xd, [[yb+.85,dz-.08],[yb+.85,dz+.98],[yb+1.3,dz+.45]], '#3f302a');
}
// Two-story white portico: columns, porch, front door with a fanlight, lettered frieze and pediment
function drawPortico(h, xi, zMid){
  const s = h.side, pw = h.pw, xc = xi - s*1.15, xf = xi - s*1.35, ct = 3.1, zA = zMid - pw, zB = zMid + pw;
  if (zB < ZN) return;
  gquad(Math.min(xi, xf - s*.5), Math.max(xi, xf - s*.5), zA - .25, zB + .25, '#dcd7cb', .02);
  gquad(Math.min(xi, xf - s*.5), Math.max(xi, xf - s*.5), zMid - .7, zMid + .7, '#cfc9bc', .03);
  // front door
  if (zMid + .6 > ZN) {
    vquad(xi, 0, 2.55, zMid - .62, zMid + .62, TRIM);
    vquad(xi, 0, 2.2, zMid - .45, zMid + .45, h.door);
    sidePoly(xi, [[2.24,zMid-.42],[2.24,zMid+.42],[2.45,zMid]], '#ffe7a3');
    vquad(xi, 0, 2.2, zMid - .02, zMid + .02, 'rgba(0,0,0,.35)');
  }
  // columns, far to near
  const span = 2*pw - .3, cols = [];
  for (let i=0;i<4;i++) cols.push(zA + .15 + span*i/3);
  cols.sort((a,b) => b-a);
  for (const cz of cols) {
    if (cz < ZN + .05) continue;
    const b = P(xc, 0, cz), t = P(xc, ct, cz), w = Math.max(1.5, b.s*.24);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(b.x - w/2, t.y, w, b.y - t.y);
    ctx.fillStyle = 'rgba(0,0,0,.13)'; ctx.fillRect(s < 0 ? b.x - w/2 : b.x + w/2 - w*.32, t.y, w*.32, b.y - t.y);
    ctx.fillStyle = TRIM; ctx.fillRect(b.x - w*.7, t.y, w*1.4, Math.max(1, w*.28)); ctx.fillRect(b.x - w*.7, b.y - w*.3, w*1.4, w*.3);
  }
  // porch ceiling, lettered frieze, pediment
  gquad(Math.min(xi, xf), Math.max(xi, xf), zA - .05, zB + .05, '#e6e0d2', ct);
  facadeName(h, xf, ct, ct + .75, zA - .05, zB + .05);
  sidePoly(xf, [[ct+.75,zA-.2],[ct+.75,zB+.2],[ct+1.55,zMid]], TRIM);
  sidePoly(xf, [[ct+.86,zA+.15],[ct+.86,zB-.15],[ct+1.42,zMid]], '#e9e3d6');
}
// Tudor: small brick vestibule with an arched door and a half-timbered gable, name board above the door
function drawTudorEntry(h, xi, zMid){
  const s = h.side, xf = xi - s*.8, zA = zMid - h.pw, zB = zMid + h.pw;
  if (zB < ZN) return;
  gquad(Math.min(xi, xf - s*.5), Math.max(xi, xf - s*.5), zMid - 1.2, zMid + 1.2, '#cfc9bc', .03);
  if (zMid + 1.05 > ZN) {
    vquad(xf, 0, 2.9, zMid - 1.05, zMid + 1.05, h.col[0]);
    vquad(xf, 0, 1.9, zMid - .42, zMid + .42, h.door);
    sidePoly(xf, [[1.9,zMid-.42],[1.9,zMid+.42],[2.2,zMid+.25],[2.28,zMid],[2.2,zMid-.25]], h.door);
    sidePoly(xf, [[2.9,zMid-1.15],[2.9,zMid+1.15],[3.95,zMid]], '#efe6d2');
    vquad(xf, 2.9, 3.85, zMid - .04, zMid + .04, '#3b2a20');
    vquad(xf, 2.86, 2.94, zMid - 1.15, zMid + 1.15, '#3b2a20');
  }
  facadeName(h, xf - s*.03, 2.12, 2.82, zA, zB);
}
// Modern: glass entry under a flat canopy, name band on the wall above it
function drawModernEntry(h, xi, zMid){
  const s = h.side, xc = xi - s*1.1, zA = zMid - h.pw, zB = zMid + h.pw;
  if (zB < ZN) return;
  gquad(Math.min(xi, xc), Math.max(xi, xc), zMid - 1.3, zMid + 1.3, '#cfc9bc', .03);
  if (zMid + .95 > ZN) {
    vquad(xi, 0, 2.5, zMid - .95, zMid + .95, '#3d4248');
    vquad(xi, .05, 2.42, zMid - .88, zMid + .88, h.lit ? '#ffe7a3' : '#8fb3c7');
    for (const m of [-.3, .3]) vquad(xi, .05, 2.42, zMid + m - .025, zMid + m + .025, '#3d4248');
  }
  gquad(Math.min(xi, xc), Math.max(xi, xc), zMid - 1.3, zMid + 1.3, '#d9d4c8', 2.6);
  vquad(xc, 2.45, 2.68, zMid - 1.3, zMid + 1.3, '#e9e5dc');
  facadeName(h, xi - s*.03, 2.85, 3.5, zA, zB);
}
// Craftsman: full-width front porch with piers, a railing and the name on the porch-roof fascia
function drawPorch(h, xi, zMid){
  const s = h.side, xp = xi - s*1.8, pz0 = h.z + .5, pz1 = h.z + h.len - .5, pt = 2.6;
  if (pz1 < ZN) return;
  gquad(Math.min(xi, xp), Math.max(xi, xp), pz0, pz1, '#b9a58a', .45);
  vquad(xp, 0, .45, pz0, pz1, '#8f7d66');
  gquad(Math.min(xp, xp - s*.6), Math.max(xp, xp - s*.6), zMid - .6, zMid + .6, '#cfc9bc', .2);
  if (zMid + .5 > ZN) {
    vquad(xi, .45, 2.4, zMid - .55, zMid + .55, TRIM);

  withCm(xc, 0, o.z, () => {
    ctx.fillStyle = '#151515'; ctx.fillRect(-68,-34,28,34); ctx.fillRect(40,-34,28,34);
    ctx.fillStyle = navy; roundRect(-75,-h*100,150,h*100-28,10); ctx.fill();
    ctx.fillStyle = green; ctx.beginPath(); ctx.moveTo(-75,-h*100+10); ctx.lineTo(10,-h*100); ctx.lineTo(-75,-150); ctx.closePath(); ctx.fill();
    ctx.fillStyle = dgreen; ctx.beginPath(); ctx.moveTo(-75,-180); ctx.lineTo(-30,-205); ctx.lineTo(-75,-150); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#20262c'; roundRect(-58,-222,116,62,6); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Verdana'; ctx.textAlign = 'center'; ctx.fillText(BUS_LABEL, 0, -128);
    ctx.font = 'bold 40px Verdana'; ctx.fillText(o.num, 4, -66);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-62,-72); ctx.lineTo(-44,-90); ctx.moveTo(-56,-90); ctx.lineTo(-44,-90); ctx.lineTo(-44,-78); ctx.stroke();
    ctx.fillStyle = '#ff3030'; ctx.fillRect(-72,-112,10,22); ctx.fillRect(62,-112,10,22);
    ctx.fillStyle = '#111'; ctx.fillRect(-78,-40,156,12);
  });
}
function drawPickup(o){
  if (o.z < ZN+.1) return;
  const bob = Math.sin(R.t*4 + o.i)*.06;
  withCm(o.lane*LANE, o.h+bob, o.z, () => {
    const c = sudsColor(o.i);
    ctx.globalAlpha = .35; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(0,0,22,0,7); ctx.fill();
    ctx.globalAlpha = 1; ctx.strokeStyle = c; ctx.lineWidth = 3.5; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-8,-8,5,0,7); ctx.fill();
  });
}
function drawPerson(cop, mode, t){
  const ph = t*13;
  if (mode==='slide') {
    ctx.fillStyle = '#2b3a67'; roundRect(-30,-30,60,26,10); ctx.fill();
    ctx.fillStyle = '#d00000'; roundRect(-28,-70,56,44,12); ctx.fill();
    ctx.fillStyle = '#e7b088'; ctx.beginPath(); ctx.arc(0,-82,16,0,7); ctx.fill();
    ctx.fillStyle = '#4a2c1a'; ctx.beginPath(); ctx.arc(0,-84,16,0,7); ctx.fill();
    ctx.strokeStyle = '#e7b088'; ctx.lineWidth = 11; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-26,-60); ctx.lineTo(-50,-30); ctx.moveTo(26,-60); ctx.lineTo(50,-30); ctx.stroke();
    return;
  }
  const air = mode==='jump';
  const shirt = cop ? '#1f2a44' : '#d00000', pants = cop ? '#18203a' : '#2b3a67', skin = cop ? '#c98d62' : '#e7b088';
  for (const side of [-1,1]) {
    const lift = air ? 28 : Math.max(0, Math.sin(ph + (side>0?Math.PI:0)))*26;
    ctx.fillStyle = pants; ctx.fillRect(side*13-7, -92, 14, 92-lift);
    ctx.fillStyle = cop ? '#111' : '#f4f4f4'; roundRect(side*13-9, -14-lift, 18, 14, 4); ctx.fill();
  }
  ctx.fillStyle = pants; roundRect(-25,-100,50,22,6); ctx.fill();
  if (cop) { ctx.fillStyle = '#111'; ctx.fillRect(-26,-96,52,7); }
  ctx.fillStyle = shirt; roundRect(-27,-155,54,62,12); ctx.fill();
  ctx.strokeStyle = skin; ctx.lineWidth = 11; ctx.lineCap = 'round';
  for (const side of [-1,1]) {
    const sw2 = air ? -1.1 : Math.sin(ph + (side>0?0:Math.PI))*.7;
    ctx.save(); ctx.translate(side*28,-145); ctx.rotate(side*.15 + sw2*side*.0 + 0);
    ctx.strokeStyle = shirt; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(side*6, 26 + sw2*-14); ctx.stroke();
    ctx.strokeStyle = skin; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(side*6, 26 + sw2*-14); ctx.lineTo(side*8, 50 + sw2*-28); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(0,-172,17,0,7); ctx.fill();
  if (cop) {
    ctx.fillStyle = '#ffd23f'; ctx.font = 'bold 13px Verdana'; ctx.textAlign = 'center'; ctx.fillText('POLICE', 0, -122);
    ctx.fillStyle = '#18203a'; ctx.beginPath(); ctx.arc(0,-178,17,Math.PI,0); ctx.fill(); ctx.fillRect(-20,-180,40,6);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(-4,-192,8,6);
  } else {
    ctx.fillStyle = '#4a2c1a'; ctx.beginPath(); ctx.arc(0,-174,17.5,0,7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.globalAlpha=.6; ctx.fillRect(-27,-128,54,5); ctx.globalAlpha=1;
    for (let i=0;i<5;i++){ ctx.fillStyle = sudsColor(i); ctx.globalAlpha=.85; ctx.beginPath(); ctx.arc(-22+i*11, -153+Math.sin(i*2)*3, 5+(i%2)*2, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
}
function drawPlayer(){
  shadow(R.x, PZ, R.slideT>0 ? 60 : 40);
  const mode = R.slideT>0 ? 'slide' : (R.y>.02 ? 'jump' : 'run');
  withCm(R.x, R.y, PZ, () => drawPerson(false, mode, R.t));
}
function drawCop(){
  const z = state==='caught' ? PZ - .9 + Math.max(0, .9 - caughtT*1.6) * -1 : PZ - 1.3 - (1-R.cop)*3.5;
  if (z < ZN+.2) return;
  const x = state==='caught' ? R.x + (R.copX-R.x)*Math.max(0,1-caughtT*2) : R.copX;
  shadow(x, z, 40);
  withCm(x, 0, z, () => drawPerson(true, 'run', R.t*1.05+1));
}
function drawRunScene(){
  drawSky(); drawGround();
  const scen = houses.concat(trees.map(t => ({ tree:true, ...t })));
  scen.sort((a,b) => b.z - a.z);
  for (const s of scen) s.tree ? drawTree(s) : drawHouse(s);
  const list = objs.slice();
  list.push({ type:'player', z:PZ }); list.push({ type:'cop', z: PZ-1.3 });
  list.sort((a,b) => b.z - a.z);
  for (const o of list) {
    if (o.type==='scooter') drawScooter(o);
    else if (o.type==='mascot') drawMascot(o);
    else if (o.type==='bus') drawBus(o);
    else if (o.type==='bubble') drawPickup(o);
    else if (o.type==='player') drawPlayer();
    else if (o.type==='cop') drawCop();
  }
  for (const p of parts) {
    const a = 1 - p.t/p.life; ctx.globalAlpha = a; ctx.strokeStyle = sudsColor(p.i); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x-p.r*.35,p.y-p.r*.35,p.r*.25,0,7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawSirens(.12 + R.cop*.22 + sirenFlash*.3);
}
function drawSirens(a){
  const on = Math.floor(clock*2.6)%2===0;
  const l = ctx.createLinearGradient(0,0,140,0); l.addColorStop(0, on?`rgba(255,30,30,${a})`:`rgba(40,90,255,${a})`); l.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = l; ctx.fillRect(0,0,140,H);
  const r = ctx.createLinearGradient(W,0,W-140,0); r.addColorStop(0, on?`rgba(40,90,255,${a})`:`rgba(255,30,30,${a})`); r.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = r; ctx.fillRect(W-140,0,140,H);
}
function drawRunHUD(){
  ctx.fillStyle='rgba(16,24,32,.72)'; roundRect(14,12,196,66,10); ctx.fill();
  ctx.fillStyle='#fdf2d0'; ctx.textAlign='left'; ctx.font='bold 30px Verdana';
  ctx.fillText(Math.floor(R.dist)+' m', 26, 46);
  ctx.font='bold 13px Verdana'; ctx.fillText('🫧 '+R.bubbles+'   BEST '+Math.floor(Math.max(best,R.dist))+' m', 26, 67);
  if (R.stumbleT>0) {
    ctx.fillStyle='rgba(208,0,0,.85)'; roundRect(W/2-150, 14, 300, 30, 10); ctx.fill();
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.font='bold 14px Verdana';
    ctx.fillText('OFFICER CLOSING IN · ' + Math.ceil(R.stumbleT) + 's', W/2, 34);
  }
  if (R.hintT>0 && state==='run') {
    ctx.globalAlpha = Math.min(1, R.hintT);
    const msg = isTouch ? 'Swipe ← → to switch lanes · ↑ to jump · ↓ to slide' : '← → switch lanes · ↑ jump · ↓ slide';
    ctx.font='bold 16px Verdana'; ctx.textAlign='center';
    const w = ctx.measureText(msg).width + 30;
    ctx.fillStyle='rgba(16,24,32,.75)'; roundRect(W/2-w/2, H-64, w, 34, 10); ctx.fill();
    ctx.fillStyle='#fdf2d0'; ctx.fillText(msg, W/2, H-41); ctx.globalAlpha = 1;
  }
}
function drawToasts(dt){
  let y = 96;
  for (let i=toasts.length-1;i>=0;i--){
    const t = toasts[i]; t.t -= dt; if (t.t<=0){ toasts.splice(i,1); continue; }
    ctx.globalAlpha = Math.min(1, t.t*2, (t.max-t.t)*4);
    ctx.font='bold 17px Verdana'; ctx.textAlign='center';
    const w = ctx.measureText(t.text).width+34;
    ctx.fillStyle='rgba(16,24,32,.8)'; roundRect(W/2-w/2, y-24, w, 36, 12); ctx.fill();
    ctx.fillStyle='#fdf2d0'; ctx.fillText(t.text, W/2, y); ctx.globalAlpha = 1; y += 44;
  }
}

/* ================= Flow ================= */
function enterFountain(){
  resetFountain(); state = 'fountain'; paused = false;
  overlay.classList.add('hidden'); fctl.classList.remove('hidden'); btnPause.classList.add('hidden');
  toasts.length = 0;
}
function startAlert(){
  if (state!=='fountain') return;
  lastCoverage = coverage; state = 'alert'; alertT = 0;
  fctl.classList.add('hidden'); pourBtn = false; keys.pour = false;
  sfx.siren(3); toasts.length = 0;
}
function startRun(){
  resetRun(); state = 'run'; paused = false; btnPause.classList.remove('hidden'); btnPause.textContent = '❚❚';
}
function setPaused(p){
  if (state!=='run') return;
  paused = p; btnPause.textContent = p ? '▶' : '❚❚';
  if (p) { panel.innerHTML = `<h2>Paused</h2><p>Officer’s waiting too.</p><div class="row"><button data-act="resume">Resume</button><button class="ghost" data-act="quit">Quit run</button></div>`; overlay.classList.remove('hidden'); }
  else overlay.classList.add('hidden');
}

function colorPicker(){
  return '<div class="colors">' + COLORS.map(c => {
    const locked = best < c.need;
    const bg = c.c || 'conic-gradient(#ff4d4d,#ffb84d,#fff04d,#6dff6d,#4dd2ff,#9b6dff,#ff4dd2,#ff4d4d)';
    return `<button class="sw ${c.id===colorId?'on':''}" data-color="${c.id}" ${locked?'disabled':''} aria-label="${c.name}${locked?' (locked)':''}">
      <i style="background:${bg}"></i><span>${c.name}</span><small>${locked ? '🔒 '+c.need.toLocaleString()+' m' : (c.id===colorId?'selected':'')}</small></button>`;
  }).join('') + '</div>';
}
function showTitle(){
  state = 'title'; fctl.classList.add('hidden'); btnPause.classList.add('hidden');
  panel.innerHTML = `
    <h1>SUDS RUN</h1>
    <p class="tag">You put soap in the fountain. Now run.</p>
    <div class="news">
      <div class="kick">Based on a true story · Daily Nebraskan, Sept. 15, 2026</div>
      <div class="hl">Soap in Broyhill Fountain causes thousands of dollars in damage</div>
      <p>Around 2 a.m. on Sept. 5, someone poured soap into the fountain outside the Nebraska Union. UNLPD treated it as vandalism. The fountain had to be drained and refilled, and its filter replaced.
      <a href="https://www.dailynebraskan.com/news/intoxication-soapy-fountain-scams-mark-first-weeks-of-unl-crime-log/article_5fbc2ccd-4127-408f-b029-08508fe2a4b9.html" target="_blank" rel="noopener">Read the story →</a></p>
    </div>
    <div class="keys">
      <b>Fountain</b><span>${isTouch?'Drag to swim, hold POUR to add soap':'Arrows/WASD swim · hold Space to pour'}</span>
      <b>Greek Row</b><span>${isTouch?'Swipe ← → lanes · ↑ jump · ↓ slide':'← → lanes · ↑ jump · ↓ slide'}</span>
      <b>Jump</b><span>scooters in the road</span>
      <b>Dodge</b><span>the city bus</span>
      <b>Slide</b><span>between the giant farmer’s legs</span>
    </div>
    <h3>Bubble color</h3>${colorPicker()}
    <p class="fine">Run farther to unlock more colors. Best: ${Math.floor(best)} m</p>
    <div class="row"><button data-act="start">Start</button><button class="ghost" data-act="why">Why this game?</button></div>`;
  overlay.classList.remove('hidden');
}
let whyBack = 'title';
function showWhy(back){
  whyBack = back;
  panel.innerHTML = `
    <h2>Why this game?</h2>
    <p>Soap in the fountain is a classic college prank. It looks hilarious for about an hour.</p>
    <p>Then the fountain gets shut off, skimmed, drained, rinsed, checked and refilled, by real staff, using real water and real money. Detergent can clog pumps and filters, stain the stone and make the plaza slippery for everyone walking past.</p>
    <p>The person who did it can face a criminal mischief citation and a separate student conduct referral.</p>
    <div class="fact" style="text-align:left;max-width:46em;margin:.8em auto">
      <b>This actually happened.</b> Around 2 a.m. on Sept. 5, 2026, someone poured soap into Broyhill Fountain outside the Nebraska Union. UNLPD handled it as vandalism. The soap caused thousands of dollars in damage: the fountain had to be drained and refilled, and its filter had to be replaced. Interim Police Chief Marty Fehringer called it “a pretty expensive endeavor,” between the water and paying someone to clean it. Video caught the people involved, but they were covered up, and the investigation was ongoing.
      <br><a href="https://www.dailynebraskan.com/news/intoxication-soapy-fountain-scams-mark-first-weeks-of-unl-crime-log/article_5fbc2ccd-4127-408f-b029-08508fe2a4b9.html" target="_blank" rel="noopener" style="color:#ffd23f;font-weight:700">Read the Daily Nebraskan story by Paige Nickless (Sept. 15, 2026) →</a>
    </div>
    <p><b>So: have fun running. Leave the actual fountain alone.</b></p>
    <p class="fine">A JOUR 304 project. Fountain details come from the Daily Nebraskan’s reporting. Other facts in the game are general.</p>
    <div class="row"><button data-act="back">Back</button></div>`;
}
let lastCaught = null;
function cleanupSteps(cov){
  const s = ['Fountain shut off so suds don’t get pulled into the pump'];
  if (cov>.03) s.push('Crew skims foam off the surface');
  if (cov>.3) s.push('Basin drained and rinsed out');
  if (cov>.55) s.push('Pumps and filters checked for detergent');
  if (cov>.72) s.push('Foam cleaned off the plaza pavement');
  if (cov>.3) s.push('Basin refilled and the water treated again');
  s.push('Fountain closed until it’s clean');
  return s;
}
function finishCaught(){
  const d = Math.floor(R.dist), old = best;
  const isBest = d > best; if (isBest) { best = d; store.set('best', best); }
  const unlocked = COLORS.filter(c => c.need > old && c.need <= best);
  const fact = FACTS[factIdx % FACTS.length]; factIdx++; store.set('fact', factIdx);
  lastCaught = { d, bubbles:R.bubbles, isBest, unlocked, fact, cov:lastCoverage };
  state = 'over'; renderCaught();
  overlay.classList.remove('hidden');
}
function renderCaught(){
  const c = lastCaught;
  panel.innerHTML = `
    <h2>CAUGHT!</h2>
    <div class="stats">
      <div class="stat"><b>${c.d} m</b>down Greek Row</div>
      <div class="stat"><b>${c.bubbles}</b>bubbles grabbed</div>
      <div class="stat"><b>${Math.floor(best)} m</b>${c.isBest?'<span class="new">new best!</span>':'best'}</div>
    </div>
    ${c.unlocked.length ? `<p class="new">Unlocked: ${c.unlocked.map(u=>u.name).join(', ')}</p>` : ''}
    <div class="cols2">
      <div><h3>Meanwhile, at the fountain (${Math.round(c.cov*100)}% foam)</h3>
        <ul class="check">${cleanupSteps(c.cov).map(s=>`<li>${s}</li>`).join('')}</ul></div>
      <div><h3>Real talk</h3><p class="fact">${c.fact}</p></div>
    </div>
    <h3>Pick your next bubble color</h3>${colorPicker()}
    <div class="row"><button data-act="again">Back to the fountain</button><button class="ghost" data-act="why">Why this game?</button></div>`;
}

panel.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  audio();
  if (b.dataset.color) {
    const c = COLORS.find(x => x.id===b.dataset.color);
    if (c && best >= c.need) { colorId = c.id; store.set('color', colorId); sfx.pop(); state==='over' ? renderCaught() : showTitle(); }
    return;
  }
  const act = b.dataset.act;
  if (act==='start' || act==='again') enterFountain();
  else if (act==='why') showWhy(state==='over' ? 'over' : 'title');
  else if (act==='back') { whyBack==='over' ? renderCaught() : showTitle(); }
  else if (act==='resume') setPaused(false);
  else if (act==='quit') { paused = false; showTitle(); }
});

/* ================= Loop ================= */
let last = performance.now();
function frame(now){
  const dt = Math.min(.033, (now-last)/1000); last = now;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if (!(state==='run' && paused)) clock += dt;

  if (state==='title' || state==='fountain' || state==='alert') {
    if (state!=='title') updateFountain(dt); else updateFountain(dt*.5);
    drawFountain();
    if (state!=='title') drawFountainHUD();
    if (state==='alert') {
      alertT += dt;
      drawSirens(.35 + Math.sin(clock*12)*.1);
      ctx.fillStyle = 'rgba(16,24,32,.82)'; roundRect(W/2-250, H/2-60, 500, 110, 16); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 30px Verdana';
      ctx.fillText('🚨 UNL POLICE! 🚨', W/2, H/2-14);
      ctx.font = 'bold 17px Verdana'; ctx.fillStyle = '#fdf2d0'; ctx.fillText('Someone called it in. Run for Greek Row!', W/2, H/2+22);
      if (alertT > 2.2) startRun();
    }
    drawToasts(dt);
  } else if (state==='run' || state==='caught' || state==='over') {
    if (state==='run' && !paused) updateRun(dt);
    if (state==='caught') { caughtT += dt; R.t += dt*.3; updateParts(dt); if (caughtT > 1.3) finishCaught(); }
    drawRunScene();
    drawRunHUD();
    if (state==='caught') {
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0,.5-caughtT)})`; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 54px Verdana';
      ctx.lineWidth = 8; ctx.strokeStyle = '#6d0000'; ctx.strokeText('BUSTED!', W/2, H/2-40); ctx.fillText('BUSTED!', W/2, H/2-40);
    }
    drawToasts(state==='run' && paused ? 0 : dt);
  }
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);

// small hook for testing in the console
window.__suds = { get state(){ return state; }, R, objs, get coverage(){ return coverage; }, foam, startAlert, enterFountain };
})();
</script>
